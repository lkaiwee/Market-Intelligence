services:
  - type: web
    name: market-intelligence-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DATABASE_URL
        sync: false
      - key: API_AUTH_REQUIRED
        value: "true"
      - key: API_ACCESS_TOKEN
        generateValue: true
      - key: CORS_ORIGINS
        value: '["https://lkaiwee.github.io","http://localhost:3000","http://127.0.0.1:3000"]'
      - key: SCHEDULER_ENABLED
        value: "false"
      - key: SCHEDULER_EXTERNAL
        value: "true"
